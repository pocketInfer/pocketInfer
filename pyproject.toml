[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pocketinfer"
version = "0.1.0"
description = "Build architecture-faithful, memory-bounded configs for LLM inference development."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "PocketInfer contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.11"]

[project.scripts]
pocketinfer = "pocketinfer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pocketinfer"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

